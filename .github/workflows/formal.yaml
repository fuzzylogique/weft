name: formal
# SymbiYosys proofs (formal/*.sby) using the OSS CAD Suite.
on: [push, workflow_dispatch]
jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-10-01'
      - name: Run every .sby
        run: |
          cd formal
          status=0
          for f in *.sby; do
            echo "=== $f"
            sby -f "$f" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formal-results
          path: formal/*/logfile.txt
