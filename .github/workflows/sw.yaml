name: sw
# Software side: assembler/ISS/firmware tests, generated-file freshness, Verilator lint.
on: [push, workflow_dispatch]
jobs:
  sw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e sw pytest==8.4.2 hypothesis
      - name: Generated files are current (ISA constants, docs/isa.md, program hex)
        run: |
          python -m weft.gen --check
          for f in sw/programs/*.asm; do python -m weft.asm "$f" -o /tmp/out.hex && cmp /tmp/out.hex "${f%.asm}.hex"; done
      - name: Assembler, ISS and firmware tests
        run: cd sw && python -m pytest -q
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint
        run: verilator --lint-only -Wall -Wno-DECLFILENAME --top-module tt_um_fuzzylogique_weft src/*.v
