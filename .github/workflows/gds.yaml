name: gds

on:
  push:
    # A full LibreLane run takes 3.5 hours; skip it for pushes that cannot change
    # the chip (docs, proofs, synthesis estimates, the other workflows). Before a
    # Tiny Tapeout submission, run it by hand (workflow_dispatch) on the final
    # commit if that commit was docs-only.
    paths-ignore:
      - 'docs/**'
      - 'formal/**'
      - 'synth/**'
      - '**.md'
      - '.github/workflows/formal.yaml'
      - '.github/workflows/sw.yaml'
      - '.github/workflows/docs.yaml'
      - '.github/workflows/test.yaml'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
